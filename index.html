<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="scroll-progress-container">
        <div id="scroll-progress-bar"></div>
    </div>
    <h2>Progress Bar</h2>
    <div class="card">
        <h3>Percentage Bar Controls</h3>
        <p>Enter a percentage between 0 and 100:</p>
        <div class="controls">
            <input type="number" id="percent-input" value="45" min="0" max="100" />
            <button id="update-btn">Update Bars</button>
        </div>
    </div>
    <div class="card">
        <h3>Linear Percentage Progress Bar</h3>
        <div class="linear-container">
            <div id="linear-fill" class="linear-fill">0%</div>
        </div>
    </div>
    <div class="card">
        <h3>Circular Progress Bar</h3>
        <div class="circle-wrapper">
            <svg width="120" height="120">
                <circle class="circle-bg" cx="60" cy="60" r="50"></circle>
                <circle id="circle-progress" class="circle-progress" cx="60" cy="60" r="50"></circle>
            </svg>
            <div id="circle-text" class="circle-text">0%</div>
        </div>
    </div>
    <div class="card" style="height: 1200px;">
        <h3>Scroll Down</h3>
        <p>Scroll down to test the top scroll progress bar in action!</p>
    </div>
    <script src="./script.js"></script>
</body>
</html>
