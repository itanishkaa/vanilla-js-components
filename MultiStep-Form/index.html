<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Step Form</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="form-container">
      <div class="step-indicator">
        <div class="step step-1 active" onclick="navigateToStep(0)">
          <div class="step-number">1</div>
          <span class="step-label">Account</span>
        </div>
        <div class="line"></div>
        <div class="step step-2" onclick="navigateToStep(1)">
          <div class="step-number">2</div>
          <span class="step-label">Personal</span>
        </div>
        <div class="line"></div>
        <div class="step step-3" onclick="navigateToStep(2)">
          <div class="step-number">3</div>
          <span class="step-label">Confirm</span>
        </div>
      </div>
      <form onsubmit="handleSubmit(event)" id="multiStepForm">
        <div class="form-step active">
          <h2>Account Setup</h2>
          <div class="input-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              name="email"
              id="email"
              required
              placeholder="john@example.com"
            />
          </div>
          <div class="input-group">
            <label for="password">Pasword</label>
            <input
              type="password"
              name="password"
              id="password"
              required
              placeholder="••••••••"
            />
          </div>
        </div>
        <div class="form-step">
          <h2>Personal Details</h2>
          <div class="input-group">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              name="fullName"
              id="fullName"
              required
              placeholder="John Doe"
            />
          </div>
          <div class="input-group">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              name="phone"
              id="phone"
              required
              placeholder="+1 234 567 890"
            />
          </div>
        </div>
        <div class="form-step">
          <h2>Confirmation</h2>
          <div class="summary-box">
            <p><strong>Email:</strong> <span id="summaryEmail">-</span></p>
            <p><strong>Name:</strong> <span id="summaryName">-</span></p>
            <p><strong>Phone:</strong> <span id="summaryPhone">-</span></p>
          </div>
          <div class="input-group checkbox-group">
            <input type="checkbox" id="terms" required />
            <label for="terms">I agree to the Terms & Conditions</label>
          </div>
        </div>
        <div class="btn-group">
          <button type="button" id="prevBtn" onclick="changeStep(-1)" disabled>
            Previous
          </button>
          <button type="button" id="nextBtn" onclick="changeStep(1)">
            Next
          </button>
          <button type="submit" id="submitBtn" class="hidden">
            Submit Registration
          </button>
        </div>
      </form>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
